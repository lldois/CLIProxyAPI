name: build-patched-linux-amd64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test patched handlers
        run: go test ./sdk/api/handlers/openai ./sdk/api/handlers

      - name: Build Ubuntu 24.04 Linux AMD64 binary with plugin support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="7.3.4-heartbeat.1"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.BuildDate=${build_date}" \
            -o dist/CLIProxyAPI ./cmd/server/
          file dist/CLIProxyAPI
          sha256sum dist/CLIProxyAPI > dist/CLIProxyAPI.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyAPI-v7.3.4-heartbeat.1-ubuntu24-amd64
          path: |
            dist/CLIProxyAPI
            dist/CLIProxyAPI.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release asset for VPS download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v7.3.4-heartbeat.1"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "CLIProxyAPI v7.3.4 heartbeat.1" \
              --notes "OpenAI streaming keepalive before the first upstream chunk; built for Ubuntu 24.04 amd64 with CGO/plugin support."
          fi
          gh release upload "$tag" dist/CLIProxyAPI dist/CLIProxyAPI.sha256 --clobber
